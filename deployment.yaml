# generated/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: road-hazard-portal
  labels:
    app: road-hazard-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: road-hazard-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: road-hazard-portal
    spec:
      containers:
      - name: portal-container
        image: yourdockerhubusername/road-hazard-portal:latest
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: road-hazard-service
spec:
  type: NodePort
  selector:
    app: road-hazard-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32080
